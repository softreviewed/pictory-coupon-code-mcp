[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pictory-mcp"
version = "1.0.0"
description = "Community Model Context Protocol (MCP) server for the complete Pictory.ai Video API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jovin", email = "developer@example.com" }
]
keywords = ["mcp", "model-context-protocol", "pictory", "video-generation", "fastmcp", "ai-video", "transcription"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
pictory-mcp = "pictory_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jovin/pictory-mcp"
Repository = "https://github.com/jovin/pictory-mcp.git"
Issues = "https://github.com/jovin/pictory-mcp/issues"
Documentation = "https://docs.pictory.ai"
